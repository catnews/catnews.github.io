name: Fetch Papers

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      disable_gate:
        description: '放开 domain gate (cron 默认已放开；手动触发时勾选才放开，不勾则过滤)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Fetch papers
        run: python config/fetch_papers.py
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LORE_DISABLE_GATE: ${{ github.event_name == 'schedule' && '1' || (inputs.disable_gate == true && '1' || '0') }}
        
      - name: Check for changes
        id: check_changes
        run: |
          git add docs/*.json docs/*.patches.json docs/.hashes.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update papers $(date '+%Y-%m-%d')"
          # Retry push up to 3 times. If a concurrent push (manual run,
          # editor save, or another cron) lands first, rebase our local
          # commit on top of origin/main and try again. The data files
          # under docs/ rarely conflict with concurrent pushes touching
          # other paths (config/, workflow yml, index.html).
          for attempt in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected (remote moved); fetching + rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase failed; aborting to leave repo in clean state"
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
