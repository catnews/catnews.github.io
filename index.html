<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatNews - 每日Linux内核网络内容精选</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(33, 150, 243, 0.16), transparent 28%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.14), transparent 30%),
                linear-gradient(180deg, #f4f9ff 0%, #f7f6f2 100%);
            color: #243447;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .layout {
            display: flex;
            gap: 20px;
        }
        
        .main-content {
            flex: 1;
            min-width: 0;
        }
        
        .sidebar {
            width: 220px;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                order: -1;
            }
            .highlights-grid {
                grid-template-columns: 1fr;
            }
        }
        
        header {
            background: linear-gradient(135deg, rgba(18, 87, 158, 0.95), rgba(16, 122, 94, 0.92));
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 18px 40px rgba(31, 78, 121, 0.18);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.22), transparent 22%),
                radial-gradient(circle at 82% 18%, rgba(255,255,255,0.16), transparent 18%);
            pointer-events: none;
        }
        
        h1 {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            position: relative;
            z-index: 1;
            margin-bottom: 18px;
            color: rgba(255,255,255,0.84);
            font-size: 14px;
        }

        .hero-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.14);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }
        
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            z-index: 1;
        }
        
        .date-nav button {
            background: rgba(255,255,255,0.16);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.2s, background-color 0.2s;
            backdrop-filter: blur(4px);
        }
        
        .date-nav button:hover {
            background: rgba(255,255,255,0.24);
            transform: translateY(-1px);
        }
        
        .date-nav button:disabled {
            background: rgba(255,255,255,0.08);
            cursor: not-allowed;
        }
        
        .current-date {
            font-size: 16px;
            font-weight: 700;
            min-width: 140px;
            text-align: center;
            color: #fff;
        }
        
        .category-section {
            background-color: rgba(255,255,255,0.92);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(36, 52, 71, 0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .highlights-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .highlight-panel {
            min-height: 220px;
            margin-bottom: 0;
        }

        .highlight-panel.lwn-panel {
            border-top: 4px solid #d97706;
            background: linear-gradient(180deg, #fff8ef 0%, #ffffff 100%);
        }

        .highlight-panel.papers-panel {
            border-top: 4px solid #16a34a;
            background: linear-gradient(180deg, #f4fbf7 0%, #ffffff 100%);
        }

        .weekly-note {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .highlight-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .highlight-item {
            padding-bottom: 14px;
            border-bottom: 1px solid #eee;
        }

        .highlight-item:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .highlight-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 11px;
        }
        
        .category-title {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(52, 152, 219, 0.28);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-main {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            letter-spacing: 0.02em;
        }

        .title-main i {
            color: #0f766e;
        }

        .lwn-panel .title-main i {
            color: #d97706;
        }
        
        .paper-count {
            font-size: 13px;
            font-weight: normal;
            color: #7f8c8d;
        }
        
        .paper-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            transition: transform 0.18s ease;
        }

        .paper-item:hover,
        .highlight-item:hover {
            transform: translateX(3px);
        }
        
        .paper-item:last-child {
            border-bottom: none;
        }
        
        .paper-title {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        
        .paper-title a {
            color: #1d4f91;
            text-decoration: none;
        }
        
        .paper-title a:hover {
            color: #0f766e;
            text-decoration: underline;
        }
        
        .paper-summary {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        
        .paper-meta {
            display: flex;
            gap: 8px;
            font-size: 11px;
            align-items: center;
        }
        
        .source-tag {
            background-color: #e8f4fc;
            color: #3498db;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .source-tag.arxiv {
            background-color: #fee2e2;
            color: #dc2626;
        }
        
        .source-tag.semanticscholar {
            background-color: #dbeafe;
            color: #2563eb;
        }
        
        .source-tag.lwnnet {
            background-color: #fef3c7;
            color: #d97706;
        }
        
        .source-tag.phoronix {
            background-color: #e0e7ff;
            color: #4f46e5;
        }
        
        .source-tag.kernelnewbies {
            background-color: #fce7f3;
            color: #db2777;
        }
        
        .news-section {
            border-bottom-color: #f59e0b;
        }
        
        .feature-tag {
            background-color: #d1fae5;
            color: #059669;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .tags-container {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .reading-time {
            color: #95a5a6;
            font-size: 11px;
        }
        
        .sidebar-section {
            background-color: rgba(255,255,255,0.92);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(36, 52, 71, 0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tag-stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 4px;
        }
        
        .tag-stat-item:hover {
            background-color: #f8f9fa;
        }
        
        .tag-stat-item.active {
            background-color: #e8f4fc;
        }
        
        .tag-stat-name {
            color: #333;
        }
        
        .tag-stat-count {
            background-color: #3498db;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .clear-filter {
            margin-top: 10px;
            padding: 8px;
            background-color: #fee2e2;
            color: #dc2626;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
        }
        
        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            color: #6b7280;
            font-size: 12px;
        }

        .meta-pill-icon {
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header>
            <h1><span class="hero-icon"><i class="fa-solid fa-cat"></i></span>CatNews</h1>
            <div class="hero-subtitle">追踪 Linux 内核网络论文、LWN 资讯与热点技术脉络</div>
            <div class="date-nav">
                <button id="prevDay"><i class="fa-solid fa-chevron-left"></i> 前一天</button>
                <span class="current-date" id="currentDate">-</span>
                <button id="nextDay">后一天 <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </header>

        <section class="highlights-grid" id="topHighlights">
            <section class="category-section highlight-panel lwn-panel" id="lwnHighlights">
                <h2 class="category-title"><span class="title-main"><i class="fa-regular fa-newspaper"></i>LWN 最新免费资讯</span><span class="paper-count" id="lwnCount">加载中...</span></h2>
                <div class="weekly-note">聚合最近 7 天已抓取的 LWN 免费文章，展示当期全部可读内容与 AI 中文总结。</div>
                <div class="loading">加载中...</div>
            </section>

            <section class="category-section highlight-panel papers-panel" id="weeklyPicks">
                <h2 class="category-title"><span class="title-main"><i class="fa-solid fa-flask"></i>本周精选论文</span><span class="paper-count" id="weeklyCount">加载中...</span></h2>
                <div class="weekly-note">基于最近 7 天内容自动聚合，优先展示匹配度高的论文。</div>
                <div class="loading">加载中...</div>
            </section>
        </section>

        <div class="layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title"><i class="fa-solid fa-chart-column"></i>特性统计</h3>
                    <div class="tag-stats" id="tagStats">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </aside>
            
            <main class="main-content" id="content">
                <div class="loading">加载中...</div>
            </main>
        </div>
        
        <footer>
            <i class="fa-solid fa-satellite-dish meta-pill-icon"></i> Powered by CatNews | GitHub Pages
        </footer>
    </div>
    
    <script>
        let currentDate = new Date();
        let selectedFilter = null;
        let currentData = null;
        const weeklyCache = new Map();
        
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function formatDisplayDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}年${month}月${day}日`;
        }

        function hasChineseText(text) {
            return typeof text === 'string' && /[\u4e00-\u9fff]/.test(text);
        }

        function ensureChineseSummary(item) {
            const summary = (item && item.summary) ? String(item.summary).trim() : '';
            if (summary && hasChineseText(summary)) {
                return summary;
            }
            const title = (item && item.title) ? item.title : '该论文';
            const tags = Array.isArray(item?.tags) ? item.tags.slice(0, 3) : [];
            const tagText = tags.length ? tags.join('、') : 'Linux内核网络';
            return `《${title}》与${tagText}相关。建议重点关注其内核路径、优化方法与性能评估结果。`;
        }
        
        function renderTagStats(tagStats) {
            const container = document.getElementById('tagStats');
            
            if (!tagStats || Object.keys(tagStats).length === 0) {
                container.innerHTML = '<div class="empty-message">暂无统计</div>';
                return;
            }
            
            const sortedTags = Object.entries(tagStats).sort((a, b) => b[1] - a[1]);
            container.innerHTML = '';

            sortedTags.forEach(([tag, count]) => {
                const item = document.createElement('div');
                item.className = `tag-stat-item ${selectedFilter === tag ? 'active' : ''}`;
                item.dataset.tag = tag;

                const name = document.createElement('span');
                name.className = 'tag-stat-name';
                name.textContent = tag;

                const countEl = document.createElement('span');
                countEl.className = 'tag-stat-count';
                countEl.textContent = String(count);

                item.appendChild(name);
                item.appendChild(countEl);
                container.appendChild(item);

                item.addEventListener('click', () => {
                    selectedFilter = selectedFilter === tag ? null : tag;
                    renderTagStats(currentData?.tagStats || {});
                    renderItems(currentData);
                });
            });
            
            if (selectedFilter) {
                const clearBtn = document.createElement('div');
                clearBtn.className = 'clear-filter';
                clearBtn.id = 'clearFilter';
                clearBtn.textContent = '清除筛选';
                container.appendChild(clearBtn);

                clearBtn.addEventListener('click', () => {
                    selectedFilter = null;
                    renderTagStats(currentData?.tagStats || {});
                    renderItems(currentData);
                });
            }
        }
        
        function renderItems(data) {
            const content = document.getElementById('content');
            
            if (!data || !data.categories) {
                content.innerHTML = '<div class="empty-message">暂无数据</div>';
                return;
            }
            
            content.innerHTML = '';
            
            const papers = data.categories.papers || [];
            const news = data.categories.news || [];
            let hasContent = false;

            function createItemNode(item, defaultReadingTime) {
                const wrapper = document.createElement('div');
                wrapper.className = 'paper-item';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'paper-title';

                const link = document.createElement('a');
                link.href = item.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = item.title;
                titleDiv.appendChild(link);

                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'paper-summary';
                summaryDiv.textContent = ensureChineseSummary(item);

                const metaDiv = document.createElement('div');
                metaDiv.className = 'paper-meta';

                const sourceTag = document.createElement('span');
                const sourceClass = (item.source || '').toLowerCase().replace(/[^a-z]/g, '');
                sourceTag.className = `source-tag ${sourceClass}`;
                sourceTag.textContent = item.source || '';
                metaDiv.appendChild(sourceTag);

                const tags = Array.isArray(item.tags) ? item.tags : [];
                if (tags.length > 0) {
                    const tagsContainer = document.createElement('div');
                    tagsContainer.className = 'tags-container';
                    tags.forEach(tag => {
                        const tagEl = document.createElement('span');
                        tagEl.className = 'feature-tag';
                        if (tag === selectedFilter) {
                            tagEl.style.fontWeight = 'bold';
                        }
                        tagEl.textContent = tag;
                        tagsContainer.appendChild(tagEl);
                    });
                    metaDiv.appendChild(tagsContainer);
                }

                const readingTime = document.createElement('span');
                readingTime.className = 'reading-time';
                readingTime.textContent = `约 ${item.readingTime || defaultReadingTime} 分钟`;
                metaDiv.appendChild(readingTime);

                wrapper.appendChild(titleDiv);
                wrapper.appendChild(summaryDiv);
                wrapper.appendChild(metaDiv);
                return wrapper;
            }

            function createSection(titleText, list, defaultReadingTime, extraClass) {
                const section = document.createElement('section');
                section.className = extraClass ? `category-section ${extraClass}` : 'category-section';

                const heading = document.createElement('h2');
                heading.className = 'category-title';
                heading.appendChild(document.createTextNode(titleText));

                const count = document.createElement('span');
                count.className = 'paper-count';
                count.textContent = `共 ${list.length} ${titleText === '资讯' ? '条' : '篇'}`;
                heading.appendChild(count);

                section.appendChild(heading);
                list.forEach(item => {
                    section.appendChild(createItemNode(item, defaultReadingTime));
                });
                return section;
            }
            
            if (papers.length > 0) {
                let filteredPapers = selectedFilter 
                    ? papers.filter(p => p.tags && p.tags.includes(selectedFilter))
                    : papers;
                
                if (filteredPapers.length > 0) {
                    content.appendChild(createSection('论文', filteredPapers, 5, ''));
                    hasContent = true;
                }
            }
            
            if (news.length > 0) {
                let filteredNews = selectedFilter 
                    ? news.filter(n => n.tags && n.tags.includes(selectedFilter))
                    : news;
                
                if (filteredNews.length > 0) {
                    content.appendChild(createSection('资讯', filteredNews, 3, 'news-section'));
                    hasContent = true;
                }
            }
            
            if (!hasContent) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = selectedFilter ? '当前筛选无匹配内容' : '暂无数据';
                content.appendChild(empty);
            }
        }

        function normalizeRelevanceScore(relevance) {
            if (relevance === 'high') return 3;
            if (relevance === 'medium') return 2;
            if (relevance === 'low') return 1;
            return 0;
        }

        function paperHotScore(paper) {
            const tags = Array.isArray(paper.tags) ? paper.tags : [];
            const hotTags = ['eBPF', 'XDP', 'TCP/IP', 'Netfilter', '容器网络', '性能', 'Linux内核网络'];
            let score = normalizeRelevanceScore(paper.relevance);
            tags.forEach(tag => {
                if (hotTags.includes(tag)) {
                    score += 1;
                }
            });
            return score;
        }

        function parseDateFromFilename(path) {
            const m = path.match(/(\d{4}-\d{2}-\d{2})\.json$/);
            return m ? m[1] : null;
        }

        function dateOffset(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return d;
        }

        function safeDateString(dateObj) {
            return formatDate(dateObj);
        }

        function isFreeLwnItem(item) {
            if (!item || item.source !== 'LWN.net') {
                return false;
            }
            if (item.access === 'paid') {
                return false;
            }
            const text = `${item.title || ''} ${item.summary || ''} ${item.summary_en || ''}`.toLowerCase();
            return !(/subscriber|subscription|paid|仅订阅|付费/.test(text));
        }

        async function tryLoadDay(dateStr) {
            if (weeklyCache.has(dateStr)) {
                return weeklyCache.get(dateStr);
            }
            try {
                const res = await fetch(`docs/${dateStr}.json`);
                if (!res.ok) {
                    weeklyCache.set(dateStr, null);
                    return null;
                }
                const data = await res.json();
                weeklyCache.set(dateStr, data);
                return data;
            } catch (e) {
                weeklyCache.set(dateStr, null);
                return null;
            }
        }

        function createWeeklyCard(paper, dateStr) {
            const item = document.createElement('div');
            item.className = 'paper-item';

            const title = document.createElement('div');
            title.className = 'paper-title';
            const a = document.createElement('a');
            a.href = paper.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = paper.title;
            title.appendChild(a);

            const summary = document.createElement('div');
            summary.className = 'paper-summary';
            summary.textContent = ensureChineseSummary(paper);

            const meta = document.createElement('div');
            meta.className = 'paper-meta';

            const src = document.createElement('span');
            src.className = `source-tag ${(paper.source || '').toLowerCase().replace(/[^a-z]/g, '')}`;
            src.textContent = paper.source || '';
            meta.appendChild(src);

            const day = document.createElement('span');
            day.className = 'reading-time';
            day.textContent = `收录日期 ${dateStr}`;
            meta.appendChild(day);

            item.appendChild(title);
            item.appendChild(summary);
            item.appendChild(meta);
            return item;
        }

        function createHighlightCard(item, dateStr) {
            const wrapper = document.createElement('div');
            wrapper.className = 'highlight-item';

            const title = document.createElement('div');
            title.className = 'paper-title';
            const link = document.createElement('a');
            link.href = item.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = item.title;
            title.appendChild(link);

            const summary = document.createElement('div');
            summary.className = 'paper-summary';
            summary.textContent = ensureChineseSummary(item);

            const meta = document.createElement('div');
            meta.className = 'highlight-meta';

            const src = document.createElement('span');
            src.className = `source-tag ${(item.source || '').toLowerCase().replace(/[^a-z]/g, '')}`;
            src.textContent = item.source || '';
            meta.appendChild(src);

            if (dateStr) {
                const day = document.createElement('span');
                day.className = 'reading-time';
                day.textContent = `收录日期 ${dateStr}`;
                meta.appendChild(day);
            }

            if (item.source === 'LWN.net') {
                const freeTag = document.createElement('span');
                freeTag.className = 'feature-tag';
                freeTag.textContent = '免费';
                meta.appendChild(freeTag);
            }

            const tags = Array.isArray(item.tags) ? item.tags.slice(0, 3) : [];
            tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'feature-tag';
                tagEl.textContent = tag;
                meta.appendChild(tagEl);
            });

            wrapper.appendChild(title);
            wrapper.appendChild(summary);
            wrapper.appendChild(meta);
            return wrapper;
        }

        async function loadTopHighlights() {
            const lwnSection = document.getElementById('lwnHighlights');
            const lwnCount = document.getElementById('lwnCount');
            const weekly = document.getElementById('weeklyPicks');
            const weeklyCount = document.getElementById('weeklyCount');
            lwnSection.querySelector('.loading')?.remove();
            weekly.querySelector('.loading')?.remove();

            const papers = [];
            const lwnNews = [];
            for (let i = 0; i < 7; i++) {
                const dateStr = safeDateString(dateOffset(-i));
                const dayData = await tryLoadDay(dateStr);
                if (!dayData || !dayData.categories) {
                    continue;
                }

                const dayPapers = Array.isArray(dayData.categories.papers) ? dayData.categories.papers : [];
                const dayNews = Array.isArray(dayData.categories.news) ? dayData.categories.news : [];

                dayPapers.forEach(p => {
                    papers.push({ ...p, _date: dateStr });
                });

                dayNews
                    .filter(item => isFreeLwnItem(item))
                    .forEach(item => {
                        lwnNews.push({ ...item, _date: dateStr });
                    });
            }

            const paperDedup = new Map();
            papers.forEach(p => {
                const key = (p.title || '').trim().toLowerCase();
                if (!key) return;
                if (!paperDedup.has(key) || paperHotScore(p) > paperHotScore(paperDedup.get(key))) {
                    paperDedup.set(key, p);
                }
            });

            const weeklyTop = Array.from(paperDedup.values())
                .sort((a, b) => paperHotScore(b) - paperHotScore(a))
                .slice(0, 6);

            const lwnDedup = new Map();
            lwnNews.forEach(item => {
                const key = (item.title || '').trim().toLowerCase();
                if (!key || lwnDedup.has(key)) {
                    return;
                }
                lwnDedup.set(key, item);
            });

            const latestLwn = Array.from(lwnDedup.values())
                .sort((a, b) => (b._date || '').localeCompare(a._date || ''));

            lwnCount.textContent = `共 ${latestLwn.length} 条`;
            weeklyCount.textContent = `共 ${weeklyTop.length} 篇`;

            if (latestLwn.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = '最近 7 天暂无可展示的 LWN 免费资讯';
                lwnSection.appendChild(empty);
            } else {
                const lwnList = document.createElement('div');
                lwnList.className = 'highlight-list';
                latestLwn.forEach(item => {
                    lwnList.appendChild(createHighlightCard(item, item._date));
                });
                lwnSection.appendChild(lwnList);
            }

            if (weeklyTop.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = '最近 7 天暂无可展示的高匹配论文';
                weekly.appendChild(empty);
                return;
            }

            weeklyTop.forEach(p => {
                weekly.appendChild(createWeeklyCard(p, p._date));
            });
        }

        async function findLatestAvailableDate(maxLookbackDays = 30) {
            for (let i = 0; i <= maxLookbackDays; i++) {
                const dateStr = safeDateString(dateOffset(-i));
                const dayData = await tryLoadDay(dateStr);
                if (dayData && dayData.categories) {
                    return new Date(dateStr + 'T00:00:00');
                }
            }
            return new Date();
        }
        
        function renderContent(data) {
            currentData = data;
            
            if (!data || !data.categories || Object.keys(data.categories).length === 0) {
                document.getElementById('content').innerHTML = '<div class="empty-message">暂无数据</div>';
                renderTagStats({});
                return;
            }
            
            renderTagStats(data.tagStats || {});
            renderItems(data);
        }
        
        async function loadData(date) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">加载中...</div>';
            document.getElementById('tagStats').innerHTML = '<div class="loading">加载中...</div>';
            
            const dateStr = formatDate(date);
            const url = `docs/${dateStr}.json`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('No data');
                }
                const data = await response.json();
                renderContent(data);
            } catch (error) {
                content.innerHTML = '<div class="empty-message">该日期暂无数据</div>';
                renderTagStats({});
            }
            
            document.getElementById('currentDate').textContent = formatDisplayDate(date);
            updateNavButtons();
        }
        
        function updateNavButtons() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const checkDate = new Date(currentDate);
            checkDate.setHours(0, 0, 0, 0);
            
            document.getElementById('nextDay').disabled = checkDate >= today;
        }
        
        document.getElementById('prevDay').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            loadData(currentDate);
        });
        
        document.getElementById('nextDay').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            loadData(currentDate);
        });
        
        async function initPage() {
            currentDate = await findLatestAvailableDate(30);
            await loadData(currentDate);
            await loadTopHighlights();
        }

        initPage();
    </script>
</body>
</html>
